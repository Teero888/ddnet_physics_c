name: Build

on:
  push:
  pull_request:
  merge_group:

jobs:
  build-cmake:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    env:
      CC: clang
      CXX: clang++

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true

    - name: Setup Environment (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        # Install clang, OpenMP, Ninja, and zlib.
        sudo apt-get install -y clang libomp-dev ninja-build zlib1g-dev

    - name: Setup Environment (Windows)
      if: runner.os == 'Windows'
      run: |
        # LLVM, CMake, and Ninja are preinstalled on GitHub's Windows image.
        # ddnet_map_loader fetches its pinned zlib version when no system zlib
        # package is available, so no separate zlib installer is needed here.
        $llvmBin = "C:\Program Files\LLVM\bin"
        if (-not (Test-Path "$llvmBin\clang.exe")) {
          throw "Clang was not found at $llvmBin"
        }

        $llvmBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        "CMAKE_PREFIX_PATH=C:\Program Files\LLVM" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

        & "$llvmBin\clang.exe" --version
        cmake --version
        ninja --version
      shell: pwsh

    - name: Build release
      run: |
        mkdir release
        cd release
        cmake .. -DCMAKE_BUILD_TYPE=Release -G Ninja
        cmake --build .
      shell: bash

    - name: Build debug
      run: |
        mkdir debug
        cd debug
        cmake .. -DCMAKE_BUILD_TYPE=Debug -G Ninja
        cmake --build .
      shell: bash

    - name: Compile tests
      run: |
        mkdir build_tests
        cd build_tests
        cmake .. -DCMAKE_BUILD_TYPE=Release -DTESTS=ON -G Ninja
        cmake --build .
      shell: bash

    - name: Compile examples
      run: |
        mkdir build_examples
        cd build_examples
        cmake .. -DCMAKE_BUILD_TYPE=Release -DEXAMPLES=ON -G Ninja
        cmake --build .
      shell: bash
